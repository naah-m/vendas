<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.produtos}">Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-4xl mx-auto p-4">

    <div th:replace="~{fragments.html :: navbar('produtos')}"></div>

    <div class="bg-white p-4 mt-4 shadow-md rounded-md">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800" th:text="#{produto.list.title}">Produtos</h1>
            <a th:href="@{/produtos/detalhe/{id}(id=${T(java.util.UUID).randomUUID()})}"
               class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-700"
               th:text="#{produto.form.new}">Novo Produto</a>
        </div>

        <div th:if="${#lists.isEmpty(produtos)}" class="py-8 text-center text-gray-500">
            <p th:text="#{table.no.records}">Nenhum produto cadastrado</p>
        </div>

        <table th:unless="${#lists.isEmpty(produtos)}" class="w-full bg-white">
            <thead>
            <tr class="bg-gray-200">
                <th class="py-2 px-4 text-left" th:text="#{table.header.id}">Código</th>
                <th class="py-2 px-4 text-left" th:text="#{table.header.nome}">Nome</th>
                <th class="py-2 px-4 text-left" th:text="#{table.header.categoria}">Categoria</th>
                <th class="py-2 px-4 text-left" th:text="#{table.header.preco}">Preço</th>
                <th class="py-2 px-4 text-center" th:text="#{table.header.acoes}">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="produto : ${produtos}" class="border-t hover:bg-gray-50">
                <td class="py-2 px-4 text-sm text-gray-500 font-mono" th:text="${produto.id}"></td>
                <td class="py-2 px-4">
                    <a th:href="@{/produtos/detalhe/{id}(id=${produto.id})}"
                       th:text="${produto.nome}"
                       class="text-blue-600 hover:underline"></a>
                </td>
                <td class="py-2 px-4" th:text="${produto.categoria}"></td>
                <td class="py-2 px-4" th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                <td class="py-2 px-4 text-center">
                    <form th:action="@{/produtos/delete/{id}(id=${produto.id})}" method="post"
                          onsubmit="return confirm([[#{produto.form.delete.confirm}]])">
                        <button type="submit"
                                class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-sm"
                                th:text="#{produto.form.delete}">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
